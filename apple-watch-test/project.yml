name: ELDYNWatchTest
options:
  bundleIdPrefix: com.eldyn
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.2.1
targets:
  ELDYNWatchTest:
    type: application
    platform: watchOS
    sources:
      - path: ELDYNWatchTest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eldyn.watchtest
        PRODUCT_NAME: ELDYNWatchTest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ELDYN
        INFOPLIST_KEY_WKApplication: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
